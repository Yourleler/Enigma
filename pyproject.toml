[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enigma"
version = "0.1.1"
description = "Small local coding agent for Ollama and OpenAI-compatible models"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
enigma = "enigma.cli:main"

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.2",
]

[tool.setuptools.packages.find]
include = ["enigma*"]

[tool.setuptools.package-data]
enigma = ["skills/*.md"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# Keep repository checks reproducible across developer machines.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
